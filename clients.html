    <!-- Global Footer -->
<script>
        gsap.registerPlugin(ScrollTrigger);
        
        // Header animation
        gsap.from(".gsap-fade-up", { y: 50, opacity: 0, duration: 1, ease: "power3.out" });
        
        // Logos staggered animation
        gsap.utils.toArray(".client-logo").forEach((logo, i) => {
            gsap.from(logo, {
                scrollTrigger: {
                    trigger: logo,
                    start: "top 95%",
                    toggleActions: "play none none none"
                },
                y: 40,
                opacity: 0,
                duration: 0.6,
                ease: "back.out(1.2)",
                delay: (i % 4) * 0.1 // subtle stagger per row
            });
        });
    </script>
