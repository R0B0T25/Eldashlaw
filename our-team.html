<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dash & Partners - Our Team</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { dark: '#080808', gold: '#C3A552', light: '#f5f5f5' },
                    fontFamily: { heading: ['Cabin', 'Georgia', 'serif'], body: ['Cabin', 'Georgia', 'serif'], serif: ['Georgia', 'serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #080808; color: #f5f5f5; font-family: 'Cabin', Georgia, serif; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: #080808; } ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; } ::-webkit-scrollbar-thumb:hover { background: #C3A552; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Cabin', Georgia, serif; text-transform: uppercase; }
        .huge-text { font-size: clamp(3rem, 10vw, 10rem); line-height: 0.85; margin: 0; letter-spacing: -0.02em; }
        .outline-text { color: #C3A552; -webkit-text-stroke: none; }
        .page-header { padding-top: 150px; padding-bottom: 50px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .team-member { border-bottom: 1px solid rgba(255,255,255,0.1); padding: 2rem 0; transition: all 0.3s; }
        .team-member:hover { background: rgba(252, 185, 0, 0.05); padding-left: 1rem; border-left: 4px solid #C3A552; }
    
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #C3A552; }
        .team-tab { transition: all 0.3s ease; }
        .team-tab.active { border-left-color: #C3A552; padding-left: 1.5rem; background: rgba(252, 185, 0, 0.05); }
        .team-tab.active .title-name { color: #C3A552; }
        .team-tab:hover:not(.active) { border-left-color: #666; }

    </style>
</head>
<body>

    <!-- Unified Header -->
    <div id="header-placeholder"></div>


    

    <header class="page-header px-6 md:px-10">
        <div class="max-w-7xl mx-auto">
            <h1 class="huge-text text-white">THE <span class="outline-text">MINDS</span></h1>
            <p class="font-serif italic text-gold text-2xl mt-4">Behind Dash & Partners</p>
        </div>
    </header>

        <!-- Team Grid Layout -->
    <section class="py-20 px-6 md:px-10 min-h-screen">
        <div class="max-w-7xl mx-auto">
            
            <div id="team-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 md:gap-12">
                <!-- Javascript will populate grid cards here -->
            </div>

        </div>
    </section>

    <!-- Glassmorphism Modal -->
    <div id="team-modal" class="fixed inset-0 z-[200] opacity-0 pointer-events-none transition-opacity duration-500 bg-dark/80 backdrop-blur-xl flex items-center justify-center p-4 md:p-10">
        <!-- Close Button -->
        <button id="close-modal" class="absolute top-6 right-6 md:top-10 md:right-10 text-white hover:text-gold text-4xl transition-colors cursor-item z-50">
            <i class="fas fa-times"></i>
        </button>

        <div class="bg-dark border border-white/10 rounded-2xl md:rounded-[2rem] w-full max-w-6xl max-h-[90vh] overflow-y-auto custom-scrollbar flex flex-col md:flex-row shadow-[0_20px_50px_rgba(0,0,0,0.5)] transform translate-y-10 transition-transform duration-500" id="modal-content">
            <!-- Modal Image -->
            <div class="w-full md:w-2/5 h-[40vh] md:h-[80vh] relative shrink-0">
                <img id="modal-img" src="" alt="Team Member" class="w-full h-full object-cover object-top absolute inset-0">
                <div class="absolute inset-0 bg-gradient-to-t from-dark to-transparent md:hidden"></div>
            </div>
            
            <!-- Modal Text -->
            <div class="w-full md:w-3/5 p-8 md:p-16 flex flex-col justify-center">
                <h2 id="modal-name" class="text-4xl md:text-6xl font-heading mb-2 text-white"></h2>
                <h4 id="modal-title" class="text-gold font-body tracking-widest uppercase text-sm md:text-base mb-8"></h4>
                <div class="w-16 h-1 bg-gold/50 mb-8"></div>
                <p id="modal-bio" class="text-gray-300 font-body font-light text-base md:text-lg leading-relaxed"></p>
            </div>
        </div>
    </div>

    <!-- Data Injection -->
    <script>
        const teamMembers = [{"name": "Aly Dash", "title": "The Founder", "img": "team-img/Aly Dash, The Founder.jpg", "bio": "Mr. Aly Dash is the Founding Partner of Dash & Partners and brings over 35 years of legal experience to the firm. He is a seasoned advocate with a distinguished track record in litigation and dispute resolution, regularly appearing before Egypt\u2019s Court of Cassation and the Supreme Constitutional Court.<br><br>Recognised for his strategic acumen and courtroom advocacy, Mr. Aly has represented clients in complex commercial, civil, and administrative disputes, as well as high-stakes enforcement and appellate matters. Throughout his career, Mr. Aly has earned a reputation for integrity, legal rigour, and unwavering dedication to client interests. His leadership continues to guide the firm\u2019s litigation and arbitration practice with a focus on excellence, ethics, and results."}, {"name": "Mohamed Dash", "title": "Managing Partner", "img": "team-img/Mohamed Dash, Managing Partner.jpg", "bio": "Mr. Mohamed Dash is the Managing Partner and co-founder of Dash & Partners, with over 15 years of experience in advising multinational clients, financial institutions, and high-growth companies on a broad spectrum of corporate and commercial matters.<br><br>His core areas of practice include contract drafting and negotiation, corporate structuring, and cross-border transactions, with particular strength in arbitration and alternative dispute resolution. Mr. Dash regularly advises clients on legal risk management, regulatory compliance, and complex contractual frameworks across sectors including energy, trade, telecom, and infrastructure.<br><br>Respected for his clarity of thought, commercial awareness, and strategic legal insight, Mr. Dash plays a key role in steering the firm\u2019s regional and international practice. He also leads the firm\u2019s engagements in high-value arbitrations and joint venture negotiations."}, {"name": "Sherif Abd Elkawy", "title": "Senior Associate", "img": "team-img/Sherif Abd Elkawy, Senior Associate.jpg", "bio": "Mr. Sherif Abd Elkawy is a Senior Associate at Dash & Partners and serves as the firm\u2019s Head of Litigation, bringing over 25 years of experience in dispute resolution with a particular focus on criminal law.<br><br>He has a long-standing reputation as a strategic and effective litigator, having represented clients before all levels of the Egyptian judiciary, including courts of appeal and cassation. Mr. Abd Elkawy handles a broad spectrum of contentious matters, ranging from white-collar crime and financial offenses to corporate disputes and enforcement actions.<br><br>His deep understanding of procedural law, combined with his courtroom advocacy and analytical skills, makes him an invaluable asset to the firm\u2019s litigation practice. He is frequently consulted on high-stakes disputes involving fraud, breach of trust, and regulatory investigations."}, {"name": "Ahmed Aid", "title": "Senior Associate", "img": "team-img/Ahmed Aid, Senior Associate.jpg", "bio": "Mr. Ahmed Aid is a Senior Associate at Dash & Partners and serves as the firm\u2019s Head of External Affairs, bringing over 22 years of experience in corporate governance, regulatory compliance, and public-sector engagement.<br><br>He advises local and international clients on entity structuring, licensing, and compliance with regulatory frameworks across key jurisdictions in the Middle East and North Africa. Mr. Aid has extensive experience liaising with governmental bodies, free zone authorities, and regulatory agencies, ensuring that clients' operations remain aligned with applicable legal and administrative requirements.<br><br>His expertise in navigating complex regulatory landscapes and fostering institutional relationships is integral to the firm\u2019s compliance advisory and corporate services practice."}, {"name": "Mahetab Mostafa", "title": "Corporate Associate", "img": "team-img/Mahetab Mostafa, Corporate Associate.jpg", "bio": "Ms. Mahetab Mostafa is a Corporate Associate at Dash & Partners, with a focus on business incorporation, transactional structuring, and mergers and acquisitions across the MENA region.<br><br>She advises clients on entity formation, corporate compliance, and the legal structuring of cross-border transactions, ensuring that each step aligns with the applicable legal, regulatory, and commercial frameworks. Ms. Mahetab plays a key role in supporting multinational companies, SMEs, and investment vehicles in executing acquisitions, divestitures, and corporate reorganizations.<br><br>Her precise legal drafting, responsiveness, and cross-jurisdictional insight make her a valuable contributor to the firm\u2019s corporate and transactional practice."}, {"name": "Mohamed Abaza", "title": "Corporate Associate", "img": "team-img/Mohamed Abaza, Corporate Associate.jpg", "bio": "Mr. Mohamed Abaza is a Corporate Associate at Dash & Partners, bringing over 5 years of experience in advising on corporate, technology, and telecommunications matters.<br><br>He assists clients with company formation, corporate governance, and transactional structuring, with a particular focus on legal issues arising in the tech and telecom sectors. Mr. Abaza also advises on regulatory compliance, commercial contracting, and data-driven business models.<br><br>His cross-sector insight, attention to emerging technologies, and practical legal approach make him a valuable member of the firm\u2019s corporate and innovation-focused practice."}, {"name": "Ahmed Samy", "title": "Senior Associate", "img": "team-img/sempl.jpg", "bio": "Mr. Ahmed Samy is a Senior Litigation Associate at Dash & Partners, with 30 years of experience in criminal law and a distinguished track record in defending clients in complex and high-stakes criminal proceedings.<br><br>Renowned for his in-depth expertise in criminal procedures and trial strategy, Mr. Samy has successfully represented clients before all levels of the Egyptian judiciary. His practice includes matters involving financial crimes, fraud, regulatory violations, and other criminal offenses impacting business operations.<br><br>His deep procedural knowledge, courtroom presence, and pragmatic approach make him a vital member of the firm\u2019s litigation team, particularly in cases where precision and strategic execution are paramount."}, {"name": "Ahmed Mera", "title": "Associate", "img": "team-img/Ahmed Mera, Associate.jpg", "bio": "Mr. Ahmed Mera is a Litigation Associate at Dash & Partners, with 10 years of experience in criminal law. He represents clients in a wide range of criminal matters, including white-collar offenses, regulatory breaches, and general criminal defense.<br><br>Mr. Mera is actively involved in case preparation, legal research, and procedural strategy, ensuring that each matter is handled with diligence and tactical precision. He regularly appears before criminal courts and supports senior litigators in managing complex trial proceedings.<br><br>His strong procedural command and commitment to client advocacy contribute meaningfully to the firm\u2019s criminal litigation practice."}, {"name": "Mahmoud Mohamed", "title": "Associate", "img": "team-img/Mahmoud Mohamed Associate.jpg", "bio": "Mr. Mahmoud Mohamed is an Associate at Dash & Partners, with 7 years of experience in intellectual property law. He advises clients on the registration, protection, and enforcement of trademarks, copyrights, and industrial designs across multiple jurisdictions.<br><br>Mr. Mohamed has handled numerous IP filings, oppositions, and infringement matters before local and regional authorities. He also supports clients in developing IP strategies aligned with their commercial objectives, particularly in the context of brand protection and cross-border licensing.<br><br>His precise legal execution and thorough understanding of regional IP regimes make him a valuable asset to the firm\u2019s growing intellectual property practice."}, {"name": "Abeer Ahmed", "title": "Senior Associate", "img": "team-img/Abeer Ahmed, Senior Associate.jpg", "bio": "Ms. Abeer Ahmed is a Senior Associate at Dash & Partners, with over 25 years of experience in family law and personal status matters. She has advised and represented clients in a wide range of cases involving marriage, divorce, custody, inheritance, and alimony, both under civil and Sharia-based legal systems."}, {"name": "Mustafa Ibrahim", "title": "Senior Associate", "img": "team-img/sempl.jpg", "bio": "Mr. Mustafa Ibrahim is a Senior Associate at Dash & Partners, with over 27 years of legal experience specializing in civil law and commercial matters.<br><br>He advises clients on a wide range of contentious and non-contentious issues, with particular expertise in civil disputes, contractual enforcement, and commercial obligations. His longstanding practice before Egyptian courts and deep understanding of procedural and substantive civil law contribute to the firm\u2019s litigation and advisory strength."}, {"name": "Mubarak ElGamal", "title": "Senior Associate", "img": "team-img/Mubarak ElGamal, Senior Associate.jpg", "bio": "Mr. Mubarak ElGamal is a Senior Associate at Dash & Partners, bringing over 26 years of experience in criminal law and litigation.<br><br>He represents clients in a wide range of criminal proceedings, including economic crimes, white-collar offenses, and general penal matters. Mr. ElGamal is known for his strategic litigation approach, deep procedural knowledge, and ability to manage complex criminal cases before various levels of the Egyptian judiciary."}, {"name": "Ahmed Saad", "title": "Senior Associate", "img": "team-img/Ahmed Saad, Senior Associate.jpg", "bio": "Mr. Ahmed Saad is a Senior Associate at Dash & Partners, with over 18 years of experience in real estate law and property registration matters.<br><br>He advises clients on real estate transactions, title verification, registration procedures, and legal due diligence across various jurisdictions in Egypt. Mr. Saad has extensive experience handling property development projects, lease structuring, and ownership transfer processes, including interfacing with public authorities and land registries."}, {"name": "Asmaa Bendary", "title": "Accountant", "img": "team-img/Asmaa Bendary, Accountant.jpg", "bio": "Ms. Asmaa Bendary is an Accountant at Dash & Partners, with 3 years of experience in financial administration and reporting.<br><br>She supports the firm\u2019s internal financial operations, including bookkeeping, account reconciliation, and preparation of financial statements. Ms. Bendary also assists in ensuring compliance with applicable financial and tax regulations, while contributing to budgeting and cost-control processes."}, {"name": "Waleed Ahmed", "title": "Accountant", "img": "team-img/Waleed Ahmed, Accountant.jpg", "bio": "Mr. Waleed Ahmed is an Accountant at Dash & Partners, with 2 years of experience in accounting and financial support functions.<br><br>He is involved in day-to-day bookkeeping, invoicing, and financial record-keeping, and provides assistance in preparing financial reports and maintaining internal accounting systems. Mr. Ahmed plays a supportive role in ensuring the firm\u2019s financial processes are accurate, timely, and aligned with regulatory standards."}, {"name": "Farah Ahmed", "title": "Corporate Associate", "img": "team-img/sempl.jpg", "bio": "Ms. Farah Ahmed is a Corporate Associate at Dash & Partners, with 3 years of experience advising on corporate and commercial matters.<br><br>Her practice includes assisting clients with company formation, regulatory compliance, and drafting a broad range of commercial agreements. Ms. Farah also supports cross-border transactions and corporate structuring across multiple sectors, ensuring alignment with local laws and international best practices."}, {"name": "Mustafa Mamdouh", "title": "Senior Associate", "img": "team-img/sempl.jpg", "bio": "Mr. Mustafa Mamdouh is a Senior Associate at Dash & Partners, bringing 19 years of experience in employment and labor law.<br><br>He advises both domestic and international clients on employment contracts, workplace policies, compliance with labor regulations, employee terminations, and disciplinary procedures. Mr. Mamdouh also represents clients in employment disputes and labor claims before courts and relevant administrative bodies."}, {"name": "Walaa Hosny", "title": "Senior Associate", "img": "team-img/Walaa Hosny, Senior Associate.jpg", "bio": "Ms. Walaa Hosny is a Senior Associate at Dash & Partners, with 20 years of experience specializing in family law and personal status matters.<br><br>She advises clients on a wide range of family-related issues, including divorce, custody, alimony, inheritance, and guardianship under Egyptian personal status laws. Ms. Walaa represents clients before family courts and is recognized for her empathetic yet firm approach in handling sensitive and high-stakes matters."}, {"name": "Fatma Bendary", "title": "Associate", "img": "team-img/sempl.jpg", "bio": "Ms. Fatma Bendary is an Associate at Dash & Partners, specializing in company formation, corporate structuring, and governance matters.<br><br>She assists clients in establishing legal entities across various jurisdictions, advising on optimal corporate structures and ensuring compliance with local regulatory frameworks."}, {"name": "Mai Othman", "title": "Associate", "img": "team-img/sempl.jpg", "bio": "Ms. Mai Othman is an Associate at Dash & Partners, focusing on corporate setup, regulatory compliance, and governance frameworks.<br><br>She supports clients in navigating the legal procedures for establishing businesses, with a particular emphasis on legal form selection, licensing, and post-incorporation requirements."}, {"name": "Assem Elmallah", "title": "Associate", "img": "team-img/sempl.jpg", "bio": "Mr. Assem ElMallah is a Litigation Associate at Dash & Partners, with a focus on civil and commercial litigation and procedural law.<br><br>He supports the firm\u2019s litigation practice by preparing pleadings, managing case files, and ensuring compliance with procedural deadlines and court requirements. Mr. ElMallah is experienced in coordinating with court officers, tracking developments across various judicial stages, and assisting lead counsels in trial preparation and execution."}];
    </script>


    <!-- Unified Footer -->
    <div id="footer-placeholder"></div>
    <!-- GSAP (loads before component scripts) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <!-- Component Scripts -->
    <script src="components/header-en.js"></script>
    <script src="components/footer-en.js"></script>
    <script src="components/loader.js"></script>


    

    

    
    <!-- Global Footer -->
<script>
        if(window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
            const cursorDot = document.querySelector(".cursor-dot"); const cursorOutline = document.querySelector(".cursor-outline");
            window.addEventListener("mousemove", function(e) {
                cursorDot.style.left = `${e.clientX}px`; cursorDot.style.top = `${e.clientY}px`;
                cursorOutline.animate({ left: `${e.clientX}px`, top: `${e.clientY}px` }, { duration: 500, fill: "forwards" });
            });
            document.querySelectorAll(".cursor-item").forEach(item => {
                item.addEventListener("mouseenter", () => { document.body.classList.add("cursor-hover"); });
                item.addEventListener("mouseleave", () => { document.body.classList.remove("cursor-hover"); });
            });
        }
        
        
        
        gsap.registerPlugin(ScrollTrigger);
        gsap.from(".gsap-fade-up", { y: 50, opacity: 0, duration: 1, ease: "power3.out" });
        
        
// Team Grid Logic
        const teamGrid = document.getElementById('team-grid');
        const modal = document.getElementById('team-modal');
        const modalContent = document.getElementById('modal-content');
        const closeModal = document.getElementById('close-modal');
        
        const modalImg = document.getElementById('modal-img');
        const modalName = document.getElementById('modal-name');
        const modalTitle = document.getElementById('modal-title');
        const modalBio = document.getElementById('modal-bio');

        if (typeof teamMembers !== 'undefined' && teamGrid) {
            teamMembers.forEach((member, index) => {
                const card = document.createElement('div');
                card.className = "group relative cursor-item overflow-hidden rounded-xl h-[450px] md:h-[600px] border border-white/5 shadow-xl bg-dark-alt";
                card.dataset.cursor = "hover";
                card.innerHTML = `
                    <img src="${member.img}" class="w-full h-full object-cover object-top grayscale opacity-80 group-hover:grayscale-0 group-hover:opacity-100 group-hover:scale-105 transition-all duration-700" alt="${member.name}">
                    <div class="absolute inset-0 bg-gradient-to-t from-dark via-dark/50 to-transparent opacity-80 group-hover:opacity-90 transition-opacity duration-500"></div>
                    <div class="absolute bottom-0 left-0 w-full p-8 flex flex-col justify-end items-start transform transition-transform duration-500">
                        <h3 class="text-3xl font-heading mb-1 text-white group-hover:text-gold transition-colors">${member.name}</h3>
                        <p class="text-gold/80 font-body tracking-widest uppercase text-xs md:text-sm mb-0 group-hover:mb-4 transition-all">${member.title}</p>
                        <span class="text-white text-sm font-bold uppercase tracking-widest opacity-0 h-0 group-hover:opacity-100 group-hover:h-auto transition-all duration-500 flex items-center gap-2">
                            Read Bio <i class="fas fa-arrow-right"></i>
                        </span>
                    </div>
                `;
                
                card.addEventListener('click', () => {
                    modalImg.src = member.img;
                    modalName.textContent = member.name;
                    modalTitle.textContent = member.title;
                    modalBio.innerHTML = member.bio;
                    
                    modal.classList.remove('opacity-0', 'pointer-events-none');
                    modal.classList.add('opacity-100', 'pointer-events-auto');
                    
                    setTimeout(() => {
                        modalContent.classList.remove('translate-y-10');
                        modalContent.classList.add('translate-y-0');
                    }, 50);
                    
                    document.body.style.overflow = 'hidden';
                });
                
                teamGrid.appendChild(card);
            });
            
            // GSAP stagger animation
            gsap.from("#team-grid > div", { y: 50, opacity: 0, duration: 1, stagger: 0.1, ease: "power3.out", scrollTrigger: { trigger: "#team-grid", start: "top 80%" } });
        }

        if(closeModal) {
            closeModal.addEventListener('click', () => {
                modalContent.classList.remove('translate-y-0');
                modalContent.classList.add('translate-y-10');
                
                setTimeout(() => {
                    modal.classList.remove('opacity-100', 'pointer-events-auto');
                    modal.classList.add('opacity-0', 'pointer-events-none');
                    document.body.style.overflow = 'auto';
                }, 300);
            });
            
            // Close on background click
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal.click();
            });
        }

</script>
</body>
</html>
